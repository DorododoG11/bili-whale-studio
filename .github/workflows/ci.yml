name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 语法检查
        run: for f in lib/*.js; do node --check "$f"; done
      - name: 工具 schema 自检
        run: node test/smoke.mjs
